// ── Texto: comparación tolerante (igual que en el PC) ──
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9ñ]+/g, ' ').trim();

// Envío del progreso al PC a través de un repo privado de GitHub (solo si la página se publicó con sincronización)
async function syncToPc() {

    const n = st.ok + st.partial + st.wrong;
    app.replaceChildren($('div', { class: 'card', style: 'text-align:center' }, $('div', { style: 'font-size:42px' }, st.ok / Math.max(1, n) >= .8 ? '🏆' : '💪'), $('h2', {}, 'Sesión completada'),
      $('p', { class: 'm' }, `✓ ${st.ok}   ◐ ${st.partial}   ✗ ${st.wrong}`), $('p', { class: 'sm m' }, 'Lo fallado volverá a salir pronto.'),
      $('button', { class: 'btn p big', onclick: () => start(mode) }, 'Seguir estudiando'), $('button', { class: 'btn big', style: 'margin-top:8px', onclick: home }, 'Inicio')));
  };
  show();
}

// ── Render por tipo ──
function meta(q) { return $('div', { class: 'row sm' }, $('span', { class: 'badge' }, TYPE[q.type]), $('span', { class: 'f' }, [q.tema, q.topic].filter(Boolean).join(' › '))); }
function feedback(q, res, extra = []) {
  const T = { correct: ['¡Correcto!', '✓'], partial: ['Parcialmente correcto', '◐'], wrong: ['Incorrecto', '✗'] }[res];
  return $('div', { class: 'fb ' + res }, $('h3', {}, T[1] + ' ' + T[0]), extra,
    q.explanation ? $('div', { class: 'sec' }, $('b', {}, 'Por qué'), q.explanation) : null,
    q.evidence ? $('div', { class: 'sec' }, $('b', {}, 'Fuente en tus apuntes'), $('div', { class: 'quote' }, '«' + q.evidence + '»'), $('div', { class: 'f sm', style: 'margin-top:4px' }, q.ref)) : null);
}
function nextBtn(next) { const b = $('button', { class: 'btn p big', style: 'margin-top:12px', onclick: next }, 'Siguiente →'); setTimeout(() => b.scrollIntoView({ block: 'nearest' }), 50); return b; }

function render(q, stage, commit, next) {
  const d = q.data; const body = $('div'); stage.append(meta(q), body);
  const finish = (res, extra, bonus) => { commit(res, bonus); body.append(feedback(q, res, extra), nextBtn(next)); };
  if (q.type === 'mcq') {
    const sel = new Set(); const opts = shuffle(d.options);
    const btns = opts.map((o, i) => $('button', { class: 'opt', onclick: () => { if (done) return; if (d.multi) sel.has(o.id) ? sel.delete(o.id) : sel.add(o.id); else { sel.clear(); sel.add(o.id); } btns.forEach((b, k) => b.classList.toggle('sel', sel.has(opts[k].id))); go.disabled = !sel.size; } }, $('span', { class: 'k' }, LET[i]), $('span', {}, o.text)));
    let done = false;
    const go = $('button', { class: 'btn p big', disabled: true, style: 'margin-top:10px', onclick: () => {
      done = true; go.remove(); const corr = new Set(d.options.filter(o => o.correct).map(o => o.id));
      const hits = [...sel].filter(x => corr.has(x)).length, bad = [...sel].filter(x => !corr.has(x)).length;
      const res = hits === corr.size && !bad ? 'correct' : d.multi && hits > 0 && !bad ? 'partial' : 'wrong';
      btns.forEach((b, k) => { const o = opts[k]; b.classList.remove('sel'); if (o.correct) b.classList.add('ok'); else if (sel.has(o.id)) b.classList.add('ko'); if (o.why && (o.correct || sel.has(o.id))) b.lastChild.append($('small', {}, o.why)); });
      finish(res);
    } }, 'Comprobar');
    body.append($('div', { class: 'q' }, q.prompt), ...(d.multi ? [$('div', { class: 'sm m', style: 'margin:-8px 0 8px' }, 'Puede haber varias correctas.')] : []), ...btns, go);
  } else if (q.type === 'cloze') {
    const parts = d.text.split('____'), inputs = [], t = $('div', { class: 'cloze' });
    parts.forEach((p, i) => { t.append(p); if (i < parts.length - 1) { const inp = $('input', { type: 'text', autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false' }); inputs.push(inp); t.append(inp); } });
    const chips = $('div', { class: 'chips' }, shuffle(d.options || []).map(o => $('button', { class: 'chip', onclick: () => { const x = inputs.find(i => !i.value) || inputs[0]; x.value = o; } }, o)));
    const go = $('button', { class: 'btn p big', style: 'margin-top:12px', onclick: () => {
      go.remove(); chips.remove(); let ok = 0;
      inputs.forEach((inp, i) => { const b = d.blanks[i]; const acc = [b.answer, ...(b.alternatives || [])]; let r = fuzzy(inp.value, acc, b.confusables || []) || fuzzy(stripArt(inp.value), acc.map(stripArt), b.confusables || []); inp.disabled = true; inp.classList.add(r ? 'ok' : 'ko'); if (r) ok++; else inp.after($('b', { style: 'color:var(--ok);margin:0 4px' }, ' → ' + b.answer)); });
      const any = inputs.some(i => i.value.trim()); finish(!any || ok === 0 ? 'wrong' : ok === inputs.length ? 'correct' : 'partial');
    } }, 'Comprobar');
    body.append($('div', { class: 'sm m', style: 'margin-bottom:6px' }, q.prompt), t, chips, go);
  } else if (q.type === 'match') {
    const rights = shuffle(d.pairs.map((p, i) => ({ i, text: p.right }))); const pairs = {}; let selL = null, done = false;
    const L = d.pairs.map((p, i) => $('button', { class: 'mi', onclick: () => { if (done) return; if (pairs[i] != null) { delete pairs[i]; paint(); return; } selL = selL === i ? null : i; paint(); } }, $('span', { class: 'tag' }, LET[i]), p.left));
    const R = rights.map(r => $('button', { class: 'mi', onclick: () => { if (done || selL == null) return; for (const k of Object.keys(pairs)) if (pairs[k] === r.i) delete pairs[k]; pairs[selL] = r.i; selL = null; paint(); } }, $('span', { class: 'tag' }, '·'), r.text));
    const paint = () => { L.forEach((b, i) => b.classList.toggle('sel', selL === i)); R.forEach((b, k) => { const o = Object.keys(pairs).find(x => pairs[x] === rights[k].i); const tg = b.firstChild; tg.textContent = o != null ? LET[o] : '·'; tg.style.background = o != null ? COL[o % COL.length] : ''; }); L.forEach((b, i) => { b.firstChild.style.background = COL[i % COL.length]; }); go.disabled = !Object.keys(pairs).length; };
    const go = $('button', { class: 'btn p big', disabled: true, style: 'margin-top:12px', onclick: () => {
      done = true; go.remove(); let ok = 0;
      d.pairs.forEach((p, i) => { const r = Number(pairs[i]) === i; if (r) ok++; L[i].classList.add(r ? 'ok' : 'ko'); if (!r) L[i].append($('small', { style: 'margin-left:auto;color:var(--ok);font-weight:600;max-width:55%' }, '→ ' + p.right)); });
      finish(ok === d.pairs.length ? 'correct' : ok / d.pairs.length >= .5 ? 'partial' : 'wrong');
    } }, 'Comprobar');
    body.append($('div', { class: 'q' }, q.prompt), $('div', { class: 'sm m' }, 'Toca un concepto y luego su pareja. Toca una pareja hecha para deshacerla.'), $('div', { class: 'f sm', style: 'margin-top:8px' }, 'CONCEPTOS'), ...L, $('div', { class: 'f sm', style: 'margin-top:8px' }, 'CORRESPONDENCIAS'), ...R, go); paint();
  } else { // flash y short: pensar, revelar y autoevaluarse
    const back = q.type === 'flash' ? d.answer : (d.model_answer + (d.key_points?.length ? '\n\nConceptos clave: ' + d.key_points.join(' · ') : ''));
    const card = $('div', { class: 'flash' }, $('div', { class: 'f sm' }, 'Escribe tu respuesta'), $('div', { style: 'font-size:20px;font-weight:650;margin-top:8px' }, q.prompt));
    const mine = $('textarea', { rows: 4, placeholder: 'Escribe aquí lo que recuerdas…', autocapitalize: 'sentences', style: 'width:100%;margin-top:12px;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--ac);background:var(--acs);color:var(--t);box-sizing:border-box' });
    const reveal = $('button', { class: 'btn p big', onclick: () => {
      const typed = mine.value.trim(); reveal.remove(); mine.remove(); card.className = 'flash back';
      // Conceptos clave que has escrito (comparación tolerante); la nota final la decides tú
      const hits = typed && q.type === 'short' && d.key_points?.length ? d.key_points.map(k => ({ k, ok: norm(k).split(' ').filter(w => w.length > 3).some(w => norm(typed).includes(w.slice(0, Math.max(4, w.length - 2)))) })) : null;
      card.replaceChildren($('div', { class: 'f sm' }, q.prompt),
        typed ? $('div', { class: 'quote', style: 'margin-top:8px' }, $('b', {}, 'Tu respuesta: '), typed) : null,
        hits ? $('div', { class: 'sm', style: 'margin-top:8px' }, hits.map(h => $('div', {}, (h.ok ? '✅ ' : '❌ ') + h.k))) : null,
        $('div', { style: 'margin-top:8px;font-size:17px' }, back));
      const R = [['again', 'No la sabía', 'wrong'], ['hard', 'Con dudas', 'partial'], ['good', 'La sabía', 'correct'], ['easy', 'Fácil', 'correct']];
      body.append($('div', { class: 'rate' }, R.map(([k, l, res]) => $('button', { class: 'btn', onclick: () => { commit(res, k === 'easy'); next(); } }, l))));
      if (q.evidence) body.append($('div', { class: 'quote', style: 'margin-top:12px' }, '«' + q.evidence + '»'), $('div', { class: 'f sm' }, q.ref));
    } }, 'Mostrar respuesta');
    card.append(mine); body.append(card, reveal);
  }
}
window.__BOOTED__ = true;
home();
</script>
